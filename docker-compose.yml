services:
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    # A cache does not need to persist: a restart is a cold cache, not
    # data loss.
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # Optional: the API from the image, next to the redis above. Started only
  # with the "image" profile; `docker compose up -d redis` is unchanged.
  api:
    profiles: ["image"]
    build: .
    image: beatly-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
