[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-v -m 'not integration'"
markers = [
    "integration: runs against the local Supabase stack (db/local); deselected by default, run with -m integration",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
ignore = ["UP046", "UP047"]
