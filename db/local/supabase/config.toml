# Local Supabase stack for the integration tests only (#176). Never linked
# to a remote project. The database is built from db/migrations by
# db/local/apply_migrations.sh, not by the CLI's own migrations folder.
project_id = "beatly-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# 017_schema_baseline.sql was dumped from PostgreSQL 17.4.
major_version = 17

[db.migrations]
enabled = false

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
